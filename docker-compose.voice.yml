# Harbor — ライブトーク（LiveKit）スタック。
#
# testnet 版 / mainnet 版のアプリが別々の compose プロジェクトで動いているため、
# 音声まわりだけを独立したプロジェクトとして切り出している。
#
#   起動:  docker compose -f docker-compose.voice.yml --env-file .env.voice -p harbor-voice up -d
#
# ┌ ネットワーク方針（重要）────────────────────────────────────────┐
# │ シグナリング(WSS) … Cloudflare Tunnel を通す。7880 は Internet へ  │
# │                     直接公開しない（cloudflared からのみ到達）。   │
# │ メディア(WebRTC)  … Cloudflare Tunnel を通せない（UDP のため）。   │
# │                     グローバルIPへ直接。DTLS-SRTP で暗号化される。 │
# └──────────────────────────────────────────────────────────────┘
#
# ルーター/FW で Internet へ公開するのは **メディアだけ**:
#   mainnet: 7881/TCP ＋ 50000-50100/UDP
#   testnet: 7882/TCP ＋ 50200-50300/UDP
# 80/443/7880 は LiveKit のためには一切開放しない。
#
# 7880（シグナリング）は 127.0.0.1 にだけ publish している。
#   - cloudflared が Docker 上（推奨）: harbor-voice ネットワークに参加させ
#     http://livekit-main:7880 / http://livekit-test:7880 で到達する（publish 不要だが害もない）
#   - cloudflared がホストOS上: http://127.0.0.1:7880 / http://127.0.0.1:7883 で到達する
# 詳細は VOICE-SETUP.md を参照。
#
# ※ UDP/TCP のポートは docker のマッピングで付け替えできない（ICE candidate に
#   実ポートが載るため）。値は livekit.*.yaml 側で分けてある。
# ※ redis は LiveKit を複数ノードで束ねるときの調整用。ここは環境ごとに独立した
#   単一ノードなので不要のため置いていない。

services:
  # --- メインネット環境用 LiveKit ---
  livekit-main:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    environment:
      # livekit.mainnet.yaml 内の ${...} に展開される。
      LIVEKIT_API_KEY_MAIN: "${LIVEKIT_API_KEY_MAIN:?LIVEKIT_API_KEY_MAIN を設定してください}"
      LIVEKIT_API_SECRET_MAIN: "${LIVEKIT_API_SECRET_MAIN:?LIVEKIT_API_SECRET_MAIN を設定してください}"
    ports:
      # シグナリング: ループバックのみ（Internet へは出さない）。
      - "127.0.0.1:${LIVEKIT_MAIN_SIGNAL_PORT:-7880}:7880"
      # メディア: グローバルIPへ直接届く必要があるため 0.0.0.0 で公開。
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./livekit.mainnet.yaml:/livekit.yaml:ro
    command:
      - --config=/livekit.yaml
      # NAT 配下でグローバルIPを自動検出させる。ローカルIPしか candidate に
      # 出ない環境では .env.voice の LIVEKIT_NODE_IP にグローバルIPを設定する。
      - --node-ip=${LIVEKIT_NODE_IP:-auto}

  # --- テストネット環境用 LiveKit ---
  livekit-test:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    environment:
      LIVEKIT_API_KEY_TEST: "${LIVEKIT_API_KEY_TEST:?LIVEKIT_API_KEY_TEST を設定してください}"
      LIVEKIT_API_SECRET_TEST: "${LIVEKIT_API_SECRET_TEST:?LIVEKIT_API_SECRET_TEST を設定してください}"
    ports:
      # mainnet と衝突しないようホスト側だけ 7883 にずらす（コンテナ内は 7880）。
      - "127.0.0.1:${LIVEKIT_TEST_SIGNAL_PORT:-7883}:7880"
      - "7882:7882"
      - "50200-50300:50200-50300/udp"
    volumes:
      - ./livekit.testnet.yaml:/livekit.yaml:ro
    command:
      - --config=/livekit.yaml
      - --node-ip=${LIVEKIT_NODE_IP:-auto}

networks:
  # 各環境のアプリ compose、および Docker 上の cloudflared から
  # external network として参加する共有ネットワーク。
  default:
    name: harbor-voice
